      <line x1="0" y1="210" x2="0" y2="420"/>
      <line x1="0" y1="420" x2="-35" y2="560"/>
      <line x1="0" y1="420" x2="35" y2="560"/>
      <polyline points="-8,235 -100,300 -140,195" stroke="#10B981"/>
      <polyline points="8,235 100,300 140,195" stroke="#10B981"/>
