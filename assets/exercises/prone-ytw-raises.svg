<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#F4F1EA"/>
  <text x="600" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#6B7280">Face down, seen from above · thumbs up</text>
  <line x1="400" y1="80" x2="400" y2="600" stroke="#D6D3CB" stroke-width="3"/>
  <line x1="800" y1="80" x2="800" y2="600" stroke="#D6D3CB" stroke-width="3"/>
  <g stroke="#1F2937" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Y -->
    <g transform="translate(200,0)">
      <circle cx="0" cy="170" r="34" fill="#1F2937"/>
      <line x1="0" y1="210" x2="0" y2="420"/>
      <line x1="0" y1="420" x2="-35" y2="560"/>
      <line x1="0" y1="420" x2="35" y2="560"/>
      <line x1="-8" y1="230" x2="-120" y2="100" stroke="#10B981"/>
      <line x1="8" y1="230" x2="120" y2="100" stroke="#10B981"/>
    </g>
    <!-- T -->
    <g transform="translate(600,0)">
      <circle cx="0" cy="170" r="34" fill="#1F2937"/>
      <line x1="0" y1="210" x2="0" y2="420"/>
      <line x1="0" y1="420" x2="-35" y2="560"/>
      <line x1="0" y1="420" x2="35" y2="560"/>
      <line x1="-8" y1="235" x2="-160" y2="235" stroke="#10B981"/>
      <line x1="8" y1="235" x2="160" y2="235" stroke="#10B981"/>
