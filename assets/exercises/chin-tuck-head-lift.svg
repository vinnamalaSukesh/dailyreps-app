<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#F4F1EA"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10B981"/>
    </marker>
  </defs>
  <!-- ceiling -->
  <line x1="60" y1="70" x2="1140" y2="70" stroke="#D6D3CB" stroke-width="6"/>
  <text x="1130" y="110" text-anchor="end" font-family="sans-serif" font-size="26" fill="#6B7280">ceiling</text>
  <!-- gaze -->
  <line x1="225" y1="295" x2="225" y2="80" stroke="#9CA3AF" stroke-width="4" stroke-dasharray="12 12"/>
  <!-- bed -->
  <rect x="80" y="425" width="1040" height="60" rx="20" fill="#D6D3CB"/>
  <rect x="100" y="485" width="30" height="90" fill="#D6D3CB"/>
  <rect x="1070" y="485" width="30" height="90" fill="#D6D3CB"/>
  <!-- resting head (ghost) -->
  <circle cx="190" cy="380" r="40" fill="#1F2937" opacity="0.2"/>
  <!-- figure -->
  <g stroke="#1F2937" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="255" y1="375" x2="300" y2="402"/>
    <line x1="300" y1="402" x2="660" y2="402"/>
    <line x1="660" y1="402" x2="1050" y2="402"/>
    <line x1="330" y1="412" x2="560" y2="414" stroke-width="14"/>
  </g>
  <circle cx="215" cy="340" r="40" fill="#1F2937"/>
  <!-- chin tuck mark -->
  <path d="M262,316 Q285,340 262,362" fill="none" stroke="#10B981" stroke-width="7" stroke-linecap="round" marker-end="url(#ah)"/>
  <!-- lift arrow -->
  <line x1="120" y1="390" x2="120" y2="305" stroke="#10B981" stroke-width="8" stroke-linecap="round" marker-end="url(#ah)"/>
  <g font-family="sans-serif">
    <text x="320" y="250" font-size="40" font-weight="bold" fill="#1F2937">1. Tuck chin</text>
    <text x="320" y="300" font-size="40" font-weight="bold" fill="#1F2937">2. Lift head ~1 inch, hold 5s</text>
    <text x="600" y="615" text-anchor="middle" font-size="26" fill="#6B7280">Lying flat, eyes on the ceiling. Don't push the chin forward</text>
  </g>
</svg>
